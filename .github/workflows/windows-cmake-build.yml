# Windows + CMake 编译：验证仓库根 CMakeLists.txt 在 Windows(MSVC) 下同样能配置/构建。
# OpenCV 用官方 vc14 预编译包（与 windows-sln-build 共用同一份缓存与安装布局 D:\opencv）。
name: Windows CMake Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  OPENCV_DIR: D:\opencv
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Cache OpenCV 3.2.0
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: ${{ env.OPENCV_DIR }}
        key: opencv-3.2.0-vc14

    - name: Install OpenCV 3.2.0
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $exe = Join-Path $env:RUNNER_TEMP 'opencv-3.2.0-vc14.exe'
        $url = 'https://github.com/opencv/opencv/releases/download/3.2.0/opencv-3.2.0-vc14.exe'
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile $exe

        $7z = 'C:\Program Files\7-Zip\7z.exe'
        if (-not (Test-Path $7z)) { throw "7-Zip not found at $7z" }
        $dest = Join-Path $env:RUNNER_TEMP 'opencv-extract'
        & $7z x $exe "-o$dest" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7-Zip extract failed with code $LASTEXITCODE" }

        # 自解压包内部顶层目录是 opencv/，移动后形成 D:\opencv\build\...
        Move-Item -Path (Join-Path $dest 'opencv') -Destination $env:OPENCV_DIR

    - name: Configure CMake (MSVC x64)
      run: cmake -S . -B build -A x64

    - name: Build (${{ env.BUILD_TYPE }})
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCVTest-cmake-win-x64
        path: build/${{ env.BUILD_TYPE }}/OpenCVTest.exe
        if-no-files-found: warn
