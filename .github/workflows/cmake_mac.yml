name: cmake build mac

on:
  workflow_dispatch:
  push:
    branches: [ "cmake" ]
  pull_request:
    branches: [ "cmake" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: install opencv
      run: |
        for i in 1 2 3; do brew update-reset >/dev/null 2>&1; brew install opencv && break || sleep 15; done

    - name: configure and build
      run: |
        cmake -B build_dir -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DOpenCV_DIR="$(brew --prefix opencv)/lib/cmake/opencv4"
        cmake --build build_dir --config ${{env.BUILD_TYPE}}
