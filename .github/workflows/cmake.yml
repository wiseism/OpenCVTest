name: cmake build

on:
  push:
    branches: [ "cmake" ]
  pull_request:
    branches: [ "cmake" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: install opencv (apt)
      # vcpkg 2024.03.25 在新 runner 上多 port 反复失败(expat 下载/meson py3.12), 改用发行版 OpenCV
      run: sudo apt update && sudo apt install -y cmake libopencv-dev
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -j 2
