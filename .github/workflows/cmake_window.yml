name: cmake build win

on:
  push:
    branches: [ "cmake" ]
  pull_request:
    branches: [ "cmake" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # vcpkg 2024.03.25 的 msys2 pkgconf 镜像已 404, 改用最新 vcpkg HEAD
    - name: install opencv (vcpkg latest)
      run: |
        git clone https://github.com/microsoft/vcpkg.git $env:RUNNER_TEMP/vcpkg
        & $env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat
        & $env:RUNNER_TEMP/vcpkg/vcpkg install opencv:x64-windows
    - name: Configure & Build
      run: |
        cmake -DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake -B build
        cmake --build build --config ${{env.BUILD_TYPE}}
